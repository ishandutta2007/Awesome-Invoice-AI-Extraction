<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#334155" stop-opacity=".4"/><stop offset="100%" stop-color="#1e293b" stop-opacity=".6"/></linearGradient><linearGradient id="scanGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.05)}}@keyframes scanLine{0%{transform:translateY(0);opacity:.2}50%{opacity:1}}@keyframes floatParticle{0%{transform:translateY(0)}50%{transform:translateY(-12px)}}@keyframes dashTranslate{0%{stroke-dashoffset:0}}.bg-pulse{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.scan-ray{animation:scanLine 3.5s ease-in-out infinite}.floating-node{animation:floatParticle 4s ease-in-out infinite}.dashed-wire{stroke-dasharray:8 8;animation:dashTranslate 2s linear infinite}.badge-text,.subtitle-text,.title-text{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;fill:#fff}.subtitle-text{font-weight:500;fill:#94a3b8}.badge-text{font-weight:600;fill:#38bdf8;font-size:13px}</sty