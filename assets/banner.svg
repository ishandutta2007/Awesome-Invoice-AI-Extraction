<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Dynamic Scanning Ray Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes scanLine {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 1; }
      100% { transform: translateY(180px); opacity: 0.2; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes dashTranslate {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }
    .bg-pulse { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .scan-ray { animation: scanLine 3.5s ease-in-out infinite; }
    .floating-node { animation: floatParticle 4s ease-in-out infinite; }
    .dashed-wire { stroke-dasharray: 8 8; animation: dashTranslate 2s linear infinite; }
    .title-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; fill: #ffffff; }
    .subtitle-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; fill: #38bdf8; font-size: 13px; }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Glowing Background Orbs (Behind text & graphics) -->
  <circle cx="150" cy="80" r="140" fill="#6366f1" opacity="0.15" class="bg-pulse"/>
  <circle cx="1050" cy="270" r="160" fill="#a855f7" opacity="0.15" class="bg-pulse"/>

  <!-- Grid Pattern overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,50 L 1200,50 M 0,100 L 1200,100 M 0,150 L 1200,150 M 0,200 L 1200,200 M 0,250 L 1200,250 M 0,300 L 1200,300" />
    <path d="M 100,0 L 100,350 M 200,0 L 200,350 M 300,0 L 300,350 M 400,0 L 400,350 M 500,0 L 500,350 M 600,0 L 600,350 M 700,0 L 700,350 M 800,0 L 800,350 M 900,0 L 900,350 M 1000,0 L 1000,350 M 1100,0 L 1100,350" />
  </g>

  <!-- RIGHT SIDE: Dynamic Animated Document & AI Parsing Graphic -->
  <g transform="translate(820, 60)" class="floating-node">
    <!-- Invoice Card Base -->
    <rect x="0" y="0" width="260" height="220" rx="12" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Invoice Header Lines -->
    <rect x="25" y="25" width="70" height="10" rx="3" fill="#6366f1" />
    <rect x="180" y="25" width="55" height="8" rx="2" fill="#64748b" />
    <line x1="25" y1="50" x2="235" y2="50" stroke="#334155" stroke-width="1.5" />

    <!-- Invoice Data Field Rows -->
    <rect x="25" y="70" width="110" height="8" rx="2" fill="#94a3b8" />
    <rect x="180" y="70" width="55" height="8" rx="2" fill="#38bdf8" />
    
    <rect x="25" y="95" width="90" height="8" rx="2" fill="#64748b" />
    <rect x="180" y="95" width="55" height="8" rx="2" fill="#38bdf8" />

    <rect x="25" y="120" width="130" height="8" rx="2" fill="#94a3b8" />
    <rect x="180" y="120" width="55" height="8" rx="2" fill="#38bdf8" />

    <!-- Total Highlight Bar -->
    <rect x="25" y="160" width="210" height="30" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <rect x="35" y="171" width="60" height="8" rx="2" fill="#a855f7" />
    <rect x="165" y="169" width="60" height="12" rx="3" fill="#22c55e" />

    <!-- Dynamic Scanning Beam Effect over Card -->
    <g class="scan-ray">
      <line x1="10" y1="20" x2="250" y2="20" stroke="#38bdf8" stroke-width="3" filter="url(#glow)"/>
      <rect x="10" y="10" width="240" height="20" fill="url(#scanGrad)"/>
    </g>

    <!-- Data extraction connection line -->
    <path d="M -40,110 L 0,110" stroke="#38bdf8" stroke-width="2" class="dashed-wire" />
    <circle cx="-40" cy="110" r="4" fill="#38bdf8" filter="url(#glow)" />
  </g>

  <!-- Decorative Top Bar Gradient Line -->
  <rect x="60" y="45" width="180" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Sub-heading Badge -->
  <rect x="60" y="65" width="250" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
  <text x="75" y="82" class="badge-text">⚡ INTELLIGENT DOCUMENT PROCESSING</text>

  <!-- FOREGROUND TEXT (Main Title & Subtitle - High contrast, unhidden) -->
  <!-- Main Title -->
  <text x="60" y="145" class="title-text" font-size="44" letter-spacing="-0.5">
    Awesome Invoice AI Extraction 📄✨
  </text>
  
  <!-- Subtitle Line 1 -->
  <text x="60" y="190" class="subtitle-text" font-size="18">
    Curated SaaS Platforms &amp; Open-Source Projects for Document AI,
  </text>

  <!-- Subtitle Line 2 -->
  <text x="60" y="218" class="subtitle-text" font-size="18">
    Smart OCR, Structured Field Extraction &amp; AP Automation Workflow.
  </text>

  <!-- Metric Badges Row -->
  <g transform="translate(60, 255)">
    <!-- Badge 1: Open Source -->
    <rect x="0" y="0" width="140" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="14" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🚀 15+ OS Projects</text>

    <!-- Badge 2: SaaS Platforms -->
    <rect x="152" y="0" width="150" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="166" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">💼 10 Top SaaS Tools</text>

    <!-- Badge 3: LLM & Vision -->
    <rect x="314" y="0" width="155" height="32" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="328" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">🤖 Vision &amp; LLM Powered</text>
  </g>
</svg>
